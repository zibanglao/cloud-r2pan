<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; color: #fff; overflow: hidden; position: relative;
  background: linear-gradient(160deg, #0b1026 0%, #1a1240 45%, #2a1045 100%);
  -webkit-tap-highlight-color: transparent;
}
.orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; background: #38bdf8; top: -18%; left: -14%; }
.o2 { width: 40vmax; height: 40vmax; background: #8b5cf6; bottom: -20%; right: -10%; animation-delay: -6s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 55%; left: 8%; animation-delay: -12s; opacity: .35; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, -5vh) scale(1.12); } }

.card {
  position: relative; width: 100%; max-width: 440px;
  padding: 48px 36px 40px; border-radius: 36px; text-align: center;
  background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(255,255,255,.28);
  box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  animation: rise .65s cubic-bezier(.22,1.2,.36,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.95); } to { opacity: 1; transform: none; } }

.file-icon {
  width: 104px; height: 104px; margin: 0 auto 24px; border-radius: 30px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.32);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 14px 34px rgba(0,0,0,.35);
  position: relative; overflow: hidden;
}
.file-icon::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 62%);
  transform: translateX(-120%); animation: shine 4.5s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.file-icon .ext { font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 2px 8px rgba(0,0,0,.25); }

h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; word-break: break-all; line-height: 1.35; }
.meta { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.72); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.4); }

.stats { display: flex; gap: 10px; margin-top: 26px; }
.stat {
  flex: 1; padding: 14px 8px; border-radius: 20px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
}
.stat .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { margin-top: 3px; font-size: 12px; color: rgba(255,255,255,.6); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; margin-top: 28px; padding: 17px; border: none; border-radius: 22px;
  font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #3d9bff, #0a7cff);
  box-shadow: 0 12px 30px rgba(10,124,255,.42), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .15s cubic-bezier(.22,1.2,.36,1), box-shadow .2s;
  text-decoration: none; -webkit-user-select: none; user-select: none;
}
.btn:hover { transform: translateY(-1px) scale(1.01); }
.btn:active { transform: scale(.97); }
.btn svg { width: 19px; height: 19px; }

.hint { margin-top: 14px; font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.6; }

.warn { margin-top: 18px; padding: 13px 16px; border-radius: 16px; font-size: 13.5px; line-height: 1.55;
  background: rgba(255,159,10,.14); border: 1px solid rgba(255,159,10,.35); color: #ffd9a0; }

.loading { padding: 80px 0; text-align: center; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.brand { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
  font-size: 13px; color: rgba(255,255,255,.4); letter-spacing: .08em; }
.brand b { font-weight: 650; }
.lang-btn { margin-left: 10px; padding: 4px 13px; border-radius: 11px; border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); font-size: 12px; font-family: inherit;
  letter-spacing: 0; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: all .2s; vertical-align: 1px; }
.lang-btn:hover { background: rgba(255,255,255,.2); color: #fff; }

/* GitHub Octocat 悬浮按钮 */
.octo-float {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; z-index: 50;
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.octo-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.octo-float svg { width: 22px; height: 22px; color: #fff; }

.pw { margin-top: 6px; }
.pw input {
  width: 100%; margin-top: 22px; padding: 16px; border-radius: 16px; text-align: center;
  font-size: 17px; font-family: inherit; color: #fff; outline: none;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28);
}
.pw input::placeholder { color: rgba(255,255,255,.45); }
.pw input:focus { border-color: #3d9bff; }
.pw .err { margin-top: 10px; font-size: 13px; color: #ff8480; min-height: 18px; }
.pw .pw-hint { margin-top: 12px; font-size: 12.5px; color: rgba(255,255,255,.55); }
.pw.shake input { animation: shake .5s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

/* Turnstile */
.ts-wrap {
  width: 100%; margin-top: 22px; display: flex; justify-content: center;
}
.ts-wrap div, .ts-wrap iframe { border-radius: 14px !important; }
.ts-passed {
  width: 100%; margin-top: 22px; padding: 14px; border-radius: 16px;
  background: rgba(110,231,183,.15); border: 1px solid rgba(110,231,183,.4);
  color: #6ee7b7; font-size: 14px; text-align: center; font-weight: 600;
}
.ts-blocked-title { margin-top: 22px; font-size: 14px; color: #fde68a; font-weight: 600; }
.ts-blocked-hint { margin-top: 6px; font-size: 12.5px; color: rgba(255,255,255,.6); line-height: 1.6; }

/* ═══════ 激活码浮动按钮 ═══════ */
.code-float {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(10,132,255,.25), rgba(10,132,255,.1));
  border: 1px solid rgba(10,132,255,.45);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
  box-shadow: 0 8px 22px rgba(10,132,255,.25);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.code-float.position-right {
  left: auto;
  right: max(16px, env(safe-area-inset-right));
}
.code-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(10,132,255,.35); }
.code-float svg { width: 22px; height: 22px; color: #a5d8ff; }
.code-float .badge {
  position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
  border-radius: 50%; background: #34d399; border: 2px solid #0b1026;
}

/* ═══════ 激活码弹窗 ═══════ */
.code-modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.code-modal {
  width: min(400px, 92vw); padding: 26px 24px 22px; border-radius: 28px;
  background: linear-gradient(160deg, rgba(30,28,60,.95), rgba(15,13,38,.96));
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 -20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  animation: sheetUp .35s cubic-bezier(.22,1.1,.36,1) both;
}
@keyframes sheetUp { from { transform: translateY(40px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
.code-modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.code-modal .sub { font-size: 12.5px; color: rgba(255,255,255,.5); margin-top: 4px; }
.code-modal .close {
  position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.6); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.code-modal .close:hover { background: rgba(255,255,255,.15); color: #fff; }
.code-bound-row {
  margin-top: 16px; padding: 14px 16px; border-radius: 16px;
  background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35);
}
.code-bound-row .label { font-size: 11px; color: rgba(110,231,183,.8); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.code-bound-row .code { font-family: ui-monospace,'SF Mono',monospace; font-size: 14px; color: #6ee7b7; margin-top: 4px; letter-spacing: .03em; }
.code-bound-row .detail { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.code-bound-row .unbind-btn {
  padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.code-bound-row .unbind-btn:hover { background: rgba(255,69,58,.15); border-color: rgba(255,69,58,.4); color: #ffb3ae; }
.code-input-row {
  margin-top: 18px; display: flex; flex-direction: column; gap: 10px;
}
.code-input-row input {
  width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 14px;
  font-family: ui-monospace,'SF Mono',monospace; color: #fff; outline: none;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  letter-spacing: .04em; text-align: center;
}
.code-input-row input:focus { border-color: #3d9bff; background: rgba(255,255,255,.12); }
.code-input-row input::placeholder { color: rgba(255,255,255,.35); }
.code-btn-row { display: flex; gap: 10px; }
.code-btn-row button {
  flex: 1; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.code-btn-row button:hover { background: rgba(255,255,255,.15); }
.code-btn-row button.primary {
  background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent;
  box-shadow: 0 6px 16px rgba(10,124,255,.3);
}
.code-btn-row button.primary:hover { filter: brightness(1.06); }
.code-query-result {
  margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.8); min-height: 20px;
}
.code-query-result.ok { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.35); color: #6ee7b7; }
.code-query-result.warn { background: rgba(255,159,10,.12); border-color: rgba(255,159,10,.35); color: #fcd34d; }
.code-query-result.err { background: rgba(255,69,58,.12); border-color: rgba(255,69,58,.35); color: #fda293; }
.code-progress { margin-top: 8px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
.code-progress i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg,#34d399,#60a5fa); }

  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
  /* 上半部分整体渐隐：墙面/相框/搁板化进纸面，角色头顶轮廓保持完整。
     渐隐需在头发开始前完成，否则相框会透出来。
     左边缘同样渐隐，避免纸面到墙面之间出现竖直硬边。 */
  -webkit-mask-image:
    linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.2) 7%, rgba(0,0,0,.7) 18%, #000 32%, #000 100%),
    linear-gradient(to right, transparent 0%, rgba(0,0,0,.5) 7%, #000 20%, #000 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.2) 7%, rgba(0,0,0,.7) 18%, #000 32%, #000 100%),
    linear-gradient(to right, transparent 0%, rgba(0,0,0,.5) 7%, #000 20%, #000 100%);
  mask-composite: intersect;
  filter: drop-shadow(0 16px 34px rgba(120,90,55,.16));
  animation: skinFloat 7s ease-in-out infinite alternate;
}
@keyframes skinFloat { from { transform: translateY(0) } to { transform: translateY(-11px) } }

/* ③ 原来的彩色光斑在纸面上很突兀，收掉 */
.skin-scene ~ .orb, body:has(.skin-scene) .orb { opacity: 0 !important; }

/* ④ 内容容器抬到背景层之上 */
.card { position: relative; z-index: 10; }
.brand, .octo-float { position: relative; z-index: 11; }

/* ⑤ 卡片与浮层：改成深色**实底**（原来是半透明白玻璃）。
     这样页面上原有的白字、蓝色强调色全部照旧可用，不必逐条改文字颜色。 */
.card, .container .card {
  background: linear-gradient(158deg, #232a3d 0%, #1a2032 100%);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 26px 60px -20px rgba(35,30,20,.45), 0 3px 12px rgba(35,30,20,.16);
}

/* ⑦ share 专属：底部署名加深色药丸底衬（原本是半透明白字，压在浅色纸纹上看不清） */
.brand {
  left: 50%; right: auto; transform: translateX(-50%);
  width: max-content; padding: 6px 14px; border-radius: 999px;

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

let LANG = detectLang();
const t = (key, params) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};

document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('#loading-text').textContent = t('loading');
$('#lang-toggle').textContent = t('switchTo');
$('#lang-toggle').onclick = () => {
  try { localStorage.setItem('cd_lang', LANG === 'zh' ? 'en' : 'zh'); } catch {}
  location.reload();
};

function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function extColor(name){ return EXT_COLORS[extOf(name)]||EXT_COLORS.default; }
function fmtSize(n){
  if(!Number.isFinite(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i];
}
function fmtTime(ts){
  const d=new Date(ts),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ═══════════ 激活码本地绑定（模块作用域） ═══════════
   这两个函数原先定义在 render() 函数内部，但 triggerDownload() 和
   wireUnlock() 定义在模块顶层，根本访问不到它们 —— 结果点击「下载文件」
   时 triggerDownload() 执行到 getBoundCode() 就抛
   "ReferenceError: getBoundCode is not defined" 并立即中断，
   location.href 那行永远执行不到，表现为"点击毫无反应、无任何网络请求"。
   提到模块作用域后顶层函数才能正常取用。 */
function getBoundCode(){ try { return localStorage.getItem('r2pan_code')?.trim().toUpperCase() || null; } catch { return null; } }
function setBoundCode(c){ try { if(c) localStorage.setItem('r2pan_code', c.trim().toUpperCase()); else localStorage.removeItem('r2pan_code'); } catch {} }

let TURSTILE_LOADED = false, turnstileReady = false, pendingCb = null;
function loadTurnstileScript(onload){
  if(TURSTILE_LOADED){ if(window.turnstile){ window.turnstile.ready(cb=>{ turnstileReady = true; onload&&onload(cb); }); } return; }
  TURSTILE_LOADED = true;
  window.onTurnstileLoad = () => { turnstileReady = true; onload && onload(window.turnstile); };
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

/**
 * 渲染 Turnstile widget 并等待完成。
 * 返回 Promise<string> —— token 字符串。
 */
async function renderTurnstile(containerEl, sitekey){
  containerEl.innerHTML = '<div class="ts-wrap"><div class="ts-box" data-sitekey="'+sitekey+'"></div></div>';
  loadTurnstileScript();
  // 等待 window.turnstile 出现
  await new Promise(resolve => {
    const check = () => { if(window.turnstile){ resolve(); } else { setTimeout(check, 80); } };
    check();
  });
  return await new Promise((resolve, reject) => {
    const id = window.turnstile.render(containerEl.querySelector('.ts-box'), {
      sitekey,
      theme: 'auto',
      callback: (tk) => resolve(tk),
      'error-callback': () => reject(new Error('ts_error')),
      'timeout-callback': () => reject(new Error('ts_timeout')),
    });
    containerEl.dataset.tsWidgetId = id;
  });
}

async function boot(){
  // OAuth callback 返回的错误参数 → 页面顶部提示
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get('oauth_error');

  let info;
  let oauthProviders = [];
  try{
    const r = await fetch(`/s/${token}/info`, {cache:'no-store'});
    if(!r.ok) throw 0;
    info = await r.json();
  }catch{ renderError(t('notFoundTitle'), t('notFoundMsg')); return; }
  // 如果 OAuth2 启用了，拉启用中的 Provider 列表来渲染多个按钮
  if (info.oauth?.enabled) {
    try {
      const r2 = await fetch('/oauth/providers', {cache:'no-store'});
      if (r2.ok) {
        const j = await r2.json();
        oauthProviders = j.providers || [];
      }
    } catch {}
  }
  const siteName = info.site_title || 'cloud-r2pan';
  document.title = t('pageTitle', {site: siteName});
  $('#brand-text').innerHTML = `Powered by <b>${esc(siteName)}</b>`;
  render(info, siteName, oauthErr, oauthProviders);
}

function renderError(title,msg){
  $('#app').innerHTML = `
    <div class="file-icon" style="font-size:44px">🚫</div>
    <h1>${esc(title)}</h1>
    <div class="hint" style="margin-top:12px">${esc(msg)}</div>`;
}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;color:#6ee7b7">✓ ${esc(t('oauthLoggedInAs', {provider: oauthProviders[0]?.label || 'OAuth'}))}</div>
        <button id="oauth-logout" style="background:none;border:none;color:rgba(255,255,255,.55);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:8px">${esc(t('oauthLogout'))}</button>
      </div>
    </div>` : '';

  $('#app').innerHTML = `
    <div class="file-icon"><span class="ext" style="color:${extColor(d.name)}">${esc((ext||'FILE').toUpperCase())}</span></div>
    <h1>${esc(d.name)}</h1>
    <div class="meta">
      <span>${fmtSize(d.size)}</span>
      ${d.expires_at?`<span class="dot"></span><span>${esc(t('shared',{d:fmtTime(d.created_at)}))}</span><span class="dot"></span><span>${esc(t('expires',{d:fmtTime(d.expires_at)}))}</span>`
        :`<span class="dot"></span><span>${esc(t('shared',{d:fmtTime(d.created_at)}))}</span>`}
    </div>
    <div class="stats">
      ${d.max_downloads ? `<div class="stat"><div class="v">${d.max_downloads - d.downloads} <span style="font-size:14px;opacity:.5">/ ${d.max_downloads}</span></div><div class="k">${esc(t('remaining'))}</div></div>`
        : `<div class="stat"><div class="v">∞</div><div class="k">${esc(t('remaining'))}</div></div>`}
      <div class="stat"><div class="v">${fmtSize(d.size)}</div><div class="k">${esc(t('size'))}</div></div>
    </div>
    ${oauthErrHtml}
    ${oauthLoginBlock}
    ${oauthAuthedBlock}
    ${d.quota_exceeded?`<div class="warn">${esc(t('quotaWarn'))}</div>`:''}

    ${needTsNow && !d.quota_exceeded ? `
      <div class="ts-blocked-title">${esc(t('turnstileBlocked'))}</div>
      <div class="ts-blocked-hint">${esc(t('turnstileHint'))}</div>
      <div id="ts-container" style="margin-top:6px">${esc(t('turnstileLoading'))}</div>
    ` : ''}


    ${d.needs_password && !d.quota_exceeded ? `
      <div class="pw" id="pw-box">
        <div class="pw-hint">${esc(t('protected'))}</div>
        <input type="password" id="pw" placeholder="${esc(t('passwordPlaceholder'))}" autocomplete="off" enterkeyhint="done">
        <div class="err" id="pw-err"></div>
        <a class="btn" id="pw-go" href="javascript:void(0)">
          <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
          ${esc(t('unlock'))}
        </a>
        <div class="pw-hint">${esc(t('unlockHint'))}</div>
        ${d.direct_download_url ? `<button class="btn" id="copy-direct" style="margin-top:8px;background:rgba(255,255,255,.1);font-size:12px">📋 ${esc(t('copyDirectLink'))}</button>` : ''}
      </div>`
      :`<a class="btn" id="dl" href="javascript:void(0)" ${d.quota_exceeded?'style="pointer-events:none;opacity:.45"':''} ${oauthEnabled && !oauthAuthed?'style="pointer-events:none;opacity:.45"':''}>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${esc(t('download'))}
      </a>
      ${d.direct_download_url ? `<button class="btn" id="copy-direct" style="margin-top:8px;background:rgba(255,255,255,.1);font-size:12px">📋 ${esc(t('copyDirectLink'))}</button>` : ''}
      <div class="hint">${esc(t('hint', {site: siteName}))}</div>`}
  `;

  // OAuth 登录/退出按钮绑定
  if(oauthEnabled){
    $('#oauth-logout')?.addEventListener('click', async () => {
      await fetch('/oauth/logout', {method:'POST', credentials:'same-origin'});
      location.reload();
    });
  }

  // 复制直链按钮
  document.getElementById('copy-direct')?.addEventListener('click', async () => {
    const url = location.origin + (d.direct_download_url || '');
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.getElementById('copy-direct');
      const origText = btn.innerHTML;
      btn.innerHTML = '✓ ' + t('copied');
      setTimeout(() => { btn.innerHTML = origText; }, 1500);
    } catch {
      // clipboard API 不可用时的回退
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
  });

  // 下载按钮绑定（OAuth 未登录时禁用）
  if(!d.needs_password && !d.quota_exceeded){
    $('#dl').onclick = () => {
      if(oauthEnabled && !oauthAuthed){
        // 跳转到第一个可用 Provider 的登录页
        const firstStart = oauthProviders[0]?.start_url;
        if (firstStart) {
          location.href = firstStart + '&redirect=' + encodeURIComponent(location.pathname);
        }
        return;
      }
      triggerDownload(d, ts, tsEnabled, tsOnDownload);
    };
  }

  if(d.needs_password && $('#pw')) wireUnlock(d, ts, tsEnabled, tsOnDownload, oauthEnabled, oauthAuthed, oauthProviders);

  // ═══════ 激活码浮动按钮 & 弹窗 ═══════
  // 注意：getBoundCode / setBoundCode 已提升到模块作用域（见文件顶部
  // 「激活码本地绑定」一节）。原先它们定义在 render() 内部，导致顶层的
  // triggerDownload() / wireUnlock() 调用时抛 ReferenceError，下载按钮点了没反应。

  // 更新浮动按钮上的绑定状态 badge
  function updateCodeFloatBadge(){
    const badge = document.getElementById('code-float-badge');
    if(!badge) return;
    badge.style.display = getBoundCode() ? 'block' : 'none';
  }
  updateCodeFloatBadge();

  // 格式化字节数
  const fmtBytes = n => { n = Number(n)||0; if(n<1024) return n+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{n/=1024;i++;}while(n>=1024&&i<u.length-1); return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i]; };

  // 状态映射
  const statusMap = { unused: t('codeStatusUnused'), active: t('codeStatusActive'), revoked: t('codeStatusRevoked'), expired: t('codeStatusExpired'), exhausted: t('codeStatusExhausted') };
  const statusColorMap = { unused: '#9aa4b2', active: '#60a5fa', revoked: '#a3a3a3', expired: '#fbbf24', exhausted: '#f87171' };

  // 渲染激活码弹窗
  function openCodeModal(){
    const boundCode = getBoundCode();
    const mask = document.createElement('div');
    mask.className = 'code-modal-mask';
    mask.innerHTML = `
      <div class="code-modal" style="position:relative">
        <h3>${esc(t('codeFloatingTitle'))}</h3>
        <div class="sub">${esc(t('codeFloatingHint'))}</div>
        <button class="close" title="Close">✕</button>
        ${boundCode ? `
        <div class="code-bound-row">
          <div class="label">${esc(t('codeBound'))}</div>
          <div class="code">${esc(boundCode)}</div>
          <div class="detail">
            <span id="code-bound-status">...</span>
            <button class="unbind-btn" id="code-unbind">${esc(t('codeUnbind'))}</button>
          </div>
        </div>
        ` : ''}
        <div class="code-input-row">
          <input type="text" id="code-input" placeholder="${esc(t('codeInputPh'))}" oninput="this.value=this.value.toUpperCase()" autocomplete="off">
          <div class="code-btn-row">
            <button id="code-query">${esc(t('codeQuery'))}</button>
            <button id="code-bind" class="primary">${esc(t('codeBind'))}</button>
          </div>
        </div>
        <div class="code-query-result" id="code-query-result" style="display:none"></div>
      </div>
    `;
    document.body.appendChild(mask);
    const close = () => { mask.remove(); };
    mask.querySelector('.close').onclick = close;
    mask.onclick = e => { if(e.target === mask) close(); };
    const input = mask.querySelector('#code-input');
    setTimeout(() => input?.focus(), 100);

    // 绑定状态查询
    if(boundCode){
      fetch('/api/codes/status?code=' + encodeURIComponent(boundCode)).then(r => r.json()).then(d => {
        const st = d.status || {};
        const rem = st.remaining;
        const pct = st.pct || 0;
        const statusTxt = statusMap[st.status] || st.status;
        const color = statusColorMap[st.status] || '#fff';
        let detailHtml = `<span style="color:${color}">${esc(statusTxt)}</span>`;
        if(rem !== undefined){
          const remStr = rem === -1 ? t('codeCheckInfinite') : t('codeCheckOk', { remaining: fmtBytes(rem), total: st.total>0?fmtBytes(st.total):'∞' });
          detailHtml = `<span style="color:${color}">${esc(statusTxt)}</span> · ${esc(remStr)}`;
          if(rem !== -1 && pct > 0){
            detailHtml += `<div class="code-progress" style="margin-top:6px;width:100%"><i style="width:${pct}%"></i></div>`;
          }
        }
        mask.querySelector('#code-bound-status').innerHTML = detailHtml;
      }).catch(() => { mask.querySelector('#code-bound-status').textContent = '—'; });
    }

    // 查询按钮
    const resultBox = mask.querySelector('#code-query-result');
    mask.querySelector('#code-query').onclick = async () => {
      const code = input.value.trim().toUpperCase();
      if(!code) return;
      resultBox.style.display = 'block'; resultBox.className = 'code-query-result'; resultBox.textContent = '...';
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(code));
        const d = await r.json();
        const st = d.status || {};
        if(r.ok){
          const rem = st.remaining;
          if(rem === -1){ resultBox.textContent = t('codeCheckInfinite'); resultBox.className = 'code-query-result ok'; }
          else {
            const pct = st.pct || 0;
            resultBox.innerHTML = t('codeCheckOk', { remaining: fmtBytes(rem), total: st.total>0?fmtBytes(st.total):'∞' });
            if(pct > 0) resultBox.innerHTML += `<div class="code-progress"><i style="width:${pct}%"></i></div>`;
            resultBox.className = 'code-query-result ok';
          }
          if(!d.usable && d.reason){ resultBox.textContent += ' ⚠ ' + (d.message || statusMap[st.status] || d.reason); resultBox.className = 'code-query-result warn'; }
        } else {
          resultBox.textContent = d.message || t('codeCheckBad', {msg: 'not found'}); resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeCheckBad', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 绑定按钮（保存到 localStorage 并校验）
    mask.querySelector('#code-bind').onclick = async () => {
      const code = input.value.trim().toUpperCase();
      if(!code) return;
      resultBox.style.display = 'block'; resultBox.className = 'code-query-result'; resultBox.textContent = '...';
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(code));
        const d = await r.json();
        if(r.ok){
          if(!d.usable){
            resultBox.textContent = d.message || t('codeBindFailed', {msg: d.reason});
            resultBox.className = 'code-query-result err';
            return;
          }
          setBoundCode(code);
          updateCodeFloatBadge();
          resultBox.textContent = t('codeBindSuccess');
          resultBox.className = 'code-query-result ok';
          setTimeout(close, 800);
        } else {
          resultBox.textContent = d.message || t('codeBindFailed', {msg: 'not found'});
          resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeBindFailed', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 解绑按钮
    const unbindBtn = mask.querySelector('#code-unbind');
    if(unbindBtn){
      unbindBtn.onclick = () => {
        setBoundCode(null);
        updateCodeFloatBadge();
        close();
      };
    }

    // Enter 键 → 绑定
    input?.addEventListener('keydown', e => {
      if(e.key === 'Enter') { e.preventDefault(); mask.querySelector('#code-bind').click(); }
    });
  }

  // 浮动按钮点击 → 打开弹窗
  document.getElementById('code-float')?.addEventListener('click', openCodeModal);


  // 如果 on_share 模式需要弹 Turnstile，现在就开始渲染
  if(needTsNow && tsOnShare && ts.sitekey){
    const box = $('#ts-container');
    renderTurnstile(box, ts.sitekey).then(tk => {
      box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
      window.__tsToken = tk;
    }).catch(() => { box.innerHTML = `<div class="warn" style="text-align:center;font-size:12.5px">${esc(t('turnstileFail'))}</div>`; });
  }
}

async function triggerDownload(d, ts, tsEnabled, tsOnDownload){
  const baseUrl = `/s/${token}/download`;
  // 读取已绑定的激活码（从 localStorage）
  const code = getBoundCode();
  // both / on_download 模式：先确保有 token
  if(tsEnabled && tsOnDownload){
    let tk = window.__tsToken;
    if(!tk){
      // 还没渲染过 → 现在渲染
      const box = document.createElement('div');
      box.style.cssText = 'margin-top:20px';
      document.body.appendChild(box);
      try{
        tk = await renderTurnstile(box, ts.sitekey);
        window.__tsToken = tk;
        box.remove();
      }catch{ box.remove(); return; }
    }
    let url = `${baseUrl}?cf=${tk}`;
    if(code) url += `&code=${encodeURIComponent(code)}`;
    location.href = url;
  } else {
    let url = baseUrl;
    if(code) url += `?code=${encodeURIComponent(code)}`;
    location.href = url;
  }
}

async function wireUnlock(d, ts, tsEnabled, tsOnDownload){
  const btn = $('#pw-go'), input = $('#pw'), err = $('#pw-err');
  const unlock = async () => {
    const pass = input.value;
    if(!pass) return;
    // 读取已绑定的激活码（从 localStorage）
    const code = getBoundCode();
    btn.style.pointerEvents = 'none'; btn.style.opacity = '.6';
    err.textContent = '';
    // both 模式：需要 Turnstile token
    let turnstileToken = null;
    if(tsEnabled && ts.mode === 'both'){
      let tk = window.__tsToken;
      if(!tk){
        const box = document.createElement('div');
        box.style.cssText = 'margin-top:14px';
        document.getElementById('pw-box').appendChild(box);
        try{
          tk = await renderTurnstile(box, ts.sitekey);
          window.__tsToken = tk;
          box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
        }catch(e){ box.remove(); err.textContent = t('turnstileFail'); btn.style.pointerEvents = ''; btn.style.opacity = ''; return; }
      }
      turnstileToken = tk;
    }
    try{
      const body = { password: pass };
      if(turnstileToken) body.turnstile = turnstileToken;
      const r = await fetch(`/s/${token}/verify`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      let res = {};
      try{ res = await r.json(); }catch{}
      if(r.ok && res.url){
        // on_download 模式需要 cf 参数
        if(tsEnabled && tsOnDownload && !res.url.includes('cf=')){
          let tk = window.__tsToken;
          if(!tk){
            const box = document.createElement('div');
            box.style.cssText = 'margin-top:14px';
            document.getElementById('pw-box').appendChild(box);
            tk = await renderTurnstile(box, ts.sitekey);
            window.__tsToken = tk;
            box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
          }
          const sep = res.url.includes('?') ? '&' : '?';
          let dlUrl = res.url + sep + 'cf=' + tk;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        } else {
          let dlUrl = res.url;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        }
        return;
      }
      err.textContent = t(res.error === 'bad_password' ? 'wrongPassword' : 'wrongPassword');
      $('#pw-box').classList.remove('shake'); void $('#pw-box').offsetWidth; $('#pw-box').classList.add('shake');
      input.select();
    }catch{
      err.textContent = t('wrongPassword');
    }
    btn.style.pointerEvents = ''; btn.style.opacity = '';
  };
  btn.onclick = unlock;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
}

boot();
</script>
</body>
</html>
